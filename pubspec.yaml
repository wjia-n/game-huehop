name: huehop
description: Hue Hop by Wajiha - hop your bouncy ball through color-matched gates!
publish_to: 'none' # private game, never publish to pub.dev

version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.2.0
  share_plus: ^13.3.1
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/huehop_logo.png
    - assets/wajiha_logo.png
